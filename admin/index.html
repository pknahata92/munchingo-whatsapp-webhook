<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Munchingo Admin</title>
<style>
:root{--navy:#0B2D50;--gold:#CEAD5E;--terra:#A35A34;--terra-d:#86482A;--cream:#FAF6EB;--paper:#FFFDF8;--ink:#2A1A12;--ink2:#5B4537;--line:#E4D6BE;--band:#F3E6CC;--green:#2F7A4B;--red:#B0413E;--amber:#B7791F}
@media (prefers-color-scheme:dark){:root{--cream:#1B1612;--paper:#241D18;--ink:#F3EADB;--ink2:#C9B9A4;--line:#3A2F27;--band:#2B231C}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
header img{height:38px;width:auto}header .sp{flex:1}header small{opacity:.8;font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--terra);color:#fff;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--terra-d)}.btn.ghost{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.btn.red{background:var(--red)}.btn.small{padding:7px 14px;min-height:36px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase}
main{max-width:980px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto;padding:0 16px;text-align:center}
.login h1{font-size:22px;margin:10px 0 4px}.login p{color:var(--ink2);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(8,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:20px}.tile span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;min-height:38px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:var(--terra)}.card .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.card .meta{color:var(--ink2);font-size:13px;margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px;letter-spacing:.04em}
.b-topack{background:#FDF0D5;color:var(--amber)}.b-packed{background:#E3ECF6;color:var(--navy)}.b-shipped{background:#DDEFE3;color:var(--green)}.b-delivered{background:var(--green);color:#fff}.b-refunded,.b-cancelled{background:#F6DAD8;color:var(--red)}.b-unpaid{background:var(--band);color:var(--ink2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;overflow:auto}
.sheet.on{display:block}.panel{background:var(--cream);max-width:640px;margin:0 auto;min-height:100%;padding:16px 16px 40px}
@media(min-width:700px){.panel{margin:24px auto;min-height:0;border-radius:18px}}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.gift{background:#FBEFE8;color:#2A1A12;border:1px dashed var(--terra);border-radius:12px;padding:12px 14px;margin:10px 0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:14px}.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-word}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.line small{display:block;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:50;max-width:92vw;text-align:center}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:18px}.muted{color:var(--ink2);font-size:13px}
a{color:var(--terra)}
.pick{display:flex;gap:10px;align-items:flex-start}.pick input{width:22px;min-height:22px;margin-top:3px;flex:none}.pick>div{flex:1;min-width:0}
.tl{font-size:13px;color:var(--ink2)}.tl div{padding:4px 0;border-bottom:1px solid var(--line)}.tl div:last-child{border:0}.tl b{color:var(--ink)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.sw:last-child{border:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}.ctl select{width:auto;min-width:140px;flex:1 1 150px}
.inl{display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:13px}.inl input{width:auto;min-height:38px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0 10px;font-size:13px;color:var(--ink2)}.bar .sp{flex:1}.bar b{color:var(--ink)}
.ctl[hidden]{display:none}
.bar .btn{white-space:nowrap}.bar span:first-child{line-height:1.3}
.chip.tog.on,.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <img src="/admin/logo.png" alt="Munchingo" style="height:84px;background:var(--navy);padding:10px 18px;border-radius:16px">
  <h1>Munchingo admin</h1>
  <p>We will email a 6-digit code to your business inbox.</p>
  <div id="stepEmail">
    <input id="email" type="email" placeholder="Your email" autocomplete="email" inputmode="email">
    <div style="height:10px"></div><button class="btn" style="width:100%" id="sendCode">Email me a code</button>
  </div>
  <div id="stepCode" hidden>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="text-align:center;font-size:22px;letter-spacing:.3em">
    <div style="height:10px"></div><button class="btn" style="width:100%" id="verify">Sign in</button>
    <p class="muted" style="margin-top:12px"><a href="#" id="again">Use a different email or get a new code</a></p>
  </div>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <header>
    <img src="/admin/logo.png" alt="Munchingo"><span class="sp"></span><small id="who"></small>
    <button class="btn ghost small owner" style="color:#fff;border-color:#ffffff88" id="stockBtn" hidden>Stock</button><button class="btn ghost small owner" style="color:#fff;border-color:#ffffff88" id="teamBtn" hidden>Team</button><button class="btn ghost small" style="color:#fff;border-color:#ffffff88" id="out">Sign out</button>
  </header>
  <main>
    <div class="tiles" id="tiles"></div>
    <div class="chips" id="chips"></div>
    <div class="row"><input id="q" placeholder="Search name, phone, address, pincode, order or invoice no."><button class="btn ghost small" id="reload">Refresh</button></div>
    <div class="ctl">
      <select id="sort" aria-label="Sort by">
        <option value="new">Newest first</option><option value="old">Oldest first</option>
        <option value="valueDesc">Highest value</option><option value="valueAsc">Lowest value</option>
        <option value="boxesDesc">Most boxes</option><option value="nameAZ">Name A to Z</option>
      </select>
      <select id="range" aria-label="Date">
        <option value="all">Any date</option><option value="today">Today</option><option value="yesterday">Yesterday</option>
        <option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="month">This month</option><option value="custom">Pick dates…</option>
      </select>
      <button class="chip" id="fGift" type="button">🎁 Gift notes</button>
      <button class="chip" id="fCoupon" type="button">Coupon used</button>
      <button class="chip" id="fSet" type="button">Gift sets</button>
    </div>
    <div class="ctl" id="customDates" hidden><label class="inl">From <input type="date" id="dFrom"></label><label class="inl">To <input type="date" id="dTo"></label></div>
    <div class="bar"><span id="count"></span><span class="sp"></span><button class="btn ghost small" id="csv">Download CSV</button><button class="btn ghost small" id="reset">Clear filters</button></div>
    <div class="bar" id="bulk" hidden style="flex-wrap:wrap"></div>
    <div id="list"></div>
  </main>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var token = ''; try { token = localStorage.getItem('mngAdminToken') || ''; } catch (e) {}
  var state = { role: 'staff', sel: {}, orders: [], filter: 'topack', reasons: {}, open: null, sort: 'new', range: 'all', from: '', to: '', gift: false, coupon: false, set: false };
  try { var saved = JSON.parse(localStorage.getItem('mngAdminView') || '{}'); ['filter', 'sort', 'range', 'from', 'to', 'gift', 'coupon', 'set'].forEach(function (k) { if (saved[k] != null) state[k] = saved[k]; }); } catch (e) {}
  function saveView() { try { localStorage.setItem('mngAdminView', JSON.stringify({ filter: state.filter, sort: state.sort, range: state.range, from: state.from, to: state.to, gift: state.gift, coupon: state.coupon, set: state.set })); } catch (e) {} }
  var IST = 5.5 * 3600 * 1000;
  var istDay = function (iso) { return new Date(Date.parse(iso) + IST).toISOString().slice(0, 10); };
  var dayShift = function (n) { return new Date(Date.now() + IST - n * 86400000).toISOString().slice(0, 10); };

  // Safe DOM builder: text is always set as text, never as HTML.
  function h(tag, attrs) {
    var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') el.className = attrs[k]; else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    });
    kids.flat().forEach(function (c) { if (c == null || c === false) return; el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); });
    return el;
  }
  var inr = function (n) { return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
  var when = function (iso) { return iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; };
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, ms || 3500); }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, { method: opts.method || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Unexpected reply' }; }).then(function (j) { if (r.status === 401 && token) { signOut(true); } return j; }); });
  }

  // ── sign in ──
  function showLogin() { $('app').hidden = true; $('login').hidden = false; try { $('email').value = localStorage.getItem('mngAdminEmail') || ''; } catch (e) {} }
  function signOut(expired) { token = ''; try { localStorage.removeItem('mngAdminToken'); } catch (e) {} showLogin(); if (expired) $('loginErr').textContent = 'Please sign in again.'; }
  $('sendCode').onclick = function () {
    var email = $('email').value.trim(); if (!email) return;
    $('sendCode').disabled = true; $('loginErr').textContent = '';
    api('/admin/api/login', { method: 'POST', body: { email: email } }).then(function (j) {
      $('sendCode').disabled = false;
      if (j.ok) { try { localStorage.setItem('mngAdminEmail', email); } catch (e) {} $('stepEmail').hidden = true; $('stepCode').hidden = false; $('code').focus(); toast('If that address is allowed, a code is on its way.'); }
      else $('loginErr').textContent = j.error || 'Could not send the code.';
    });
  };
  $('verify').onclick = function () {
    $('loginErr').textContent = '';
    api('/admin/api/verify', { method: 'POST', body: { email: $('email').value.trim(), code: $('code').value.trim() } }).then(function (j) {
      if (j.ok) { token = j.token; try { localStorage.setItem('mngAdminToken', token); } catch (e) {} $('code').value = ''; start(); }
      else $('loginErr').textContent = j.error || 'That code did not work.';
    });
  };
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('verify').click(); });
  $('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('sendCode').click(); });
  $('again').onclick = function (e) { e.preventDefault(); $('stepCode').hidden = true; $('stepEmail').hidden = false; $('loginErr').textContent = ''; };
  $('out').onclick = function () { signOut(false); };

  // ── main list ──
  var FILTERS = [['topack', 'To pack'], ['packed', 'Packed'], ['shipped', 'Shipped'], ['delivered', 'Delivered'], ['refunded', 'Refunded'], ['unpaid', 'Unpaid'], ['all', 'All']];
  var LABEL = { topack: 'TO PACK', packed: 'PACKED', shipped: 'SHIPPED', delivered: 'DELIVERED' };
  function start() {
    $('login').hidden = true; $('app').hidden = false;
    api('/admin/api/me').then(function (j) { if (j.ok) { state.role = j.role; $('who').textContent = (j.name || j.email) + ' · ' + j.role; state.reasons = j.reasons; $('stockBtn').hidden = $('teamBtn').hidden = j.role !== 'owner'; render(); } });
    load();
  }
  function load() {
    api('/admin/api/summary').then(function (j) { if (j.ok) tiles(j.summary); });
    api('/admin/api/orders').then(function (j) { if (!j.ok) return toast(j.error || 'Could not load orders'); state.orders = j.orders; render(); });
  }
  function tiles(s) {
    var t = $('tiles'); t.textContent = '';
    [['Orders today', s.today.orders], ['Boxes today', s.today.boxes], ['Sales today', inr(s.today.revenue)], ['To pack', s.topack], ['Packed', s.packed], ['Shipped', s.shipped], ['Delivered', s.delivered], ['Unpaid', s.unpaid]].forEach(function (x) { t.appendChild(h('div', { class: 'tile' }, h('b', {}, x[1]), h('span', {}, x[0]))); });
  }
  function inRange(o) {
    var d = istDay(o.paid_at || o.created_at), r = state.range;
    if (r === 'all') return true;
    if (r === 'today') return d === dayShift(0);
    if (r === 'yesterday') return d === dayShift(1);
    if (r === '7') return d >= dayShift(6);
    if (r === '30') return d >= dayShift(29);
    if (r === 'month') return d.slice(0, 7) === dayShift(0).slice(0, 7);
    if (r === 'custom') return (!state.from || d >= state.from) && (!state.to || d <= state.to);
    return true;
  }
  function visible() {
    var q = $('q').value.trim().toLowerCase();
    var rows = state.orders.filter(function (o) {
      var okState = state.filter === 'all' || o.state === state.filter || (state.filter === 'refunded' && o.state === 'cancelled');
      var hay = [o.id, o.name, o.phone, o.invoice_no, o.email, o.address].join(' ').toLowerCase();
      return okState && inRange(o) && (!q || hay.indexOf(q) >= 0)
        && (!state.gift || !!o.gift_note) && (!state.coupon || !!o.coupon)
        && (!state.set || o.items.some(function (i) { return !!i.contents; }));
    });
    var key = function (o) { return o.paid_at || o.created_at; };
    var by = { new: function (a, b) { return key(b) < key(a) ? -1 : 1; }, old: function (a, b) { return key(a) < key(b) ? -1 : 1; },
      valueDesc: function (a, b) { return b.total - a.total; }, valueAsc: function (a, b) { return a.total - b.total; },
      boxesDesc: function (a, b) { return b.boxes - a.boxes; }, nameAZ: function (a, b) { return a.name.localeCompare(b.name); } };
    return rows.sort(by[state.sort] || by.new);
  }
  function render() {
    var c = $('chips'); c.textContent = '';
    FILTERS.forEach(function (f) {
      var n = f[0] === 'all' ? state.orders.length : state.orders.filter(function (o) { return o.state === f[0] || (f[0] === 'refunded' && o.state === 'cancelled'); }).length;
      c.appendChild(h('button', { class: 'chip' + (state.filter === f[0] ? ' on' : ''), onclick: function () { state.filter = f[0]; saveView(); render(); } }, f[1] + ' ' + n));
    });
    var rows = visible();
    var sum = rows.reduce(function (n, o) { return n + (o.state === 'unpaid' || o.state === 'cancelled' ? 0 : o.total); }, 0);
    var bx = rows.reduce(function (n, o) { return n + o.boxes; }, 0);
    $('count').textContent = '';
    $('count').appendChild(h('b', {}, rows.length + ' order' + (rows.length === 1 ? '' : 's')));
    $('count').appendChild(document.createTextNode(' · ' + bx + ' boxes · ' + inr(sum) + ' paid'));
    $('sort').value = state.sort; $('range').value = state.range; $('dFrom').value = state.from; $('dTo').value = state.to; $('customDates').hidden = state.range !== 'custom';
    [['fGift', 'gift'], ['fCoupon', 'coupon'], ['fSet', 'set']].forEach(function (x) { $(x[0]).classList.toggle('on', !!state[x[1]]); });
    var list = $('list'); list.textContent = '';
    if (!rows.length) list.appendChild(h('p', { class: 'muted' }, 'Nothing here.'));
    rows.forEach(function (o) {
      var pickable = o.state === 'topack' || o.state === 'packed';
      var box = pickable ? h('input', { type: 'checkbox', 'aria-label': 'Select ' + o.id, onclick: function (e) { e.stopPropagation(); if (e.target.checked) state.sel[o.id] = 1; else delete state.sel[o.id]; bulkBar(); } }) : null;
      if (box && state.sel[o.id]) box.checked = true;
      list.appendChild(h('div', { class: 'card', onclick: function () { openOrder(o.id); } }, h('div', { class: 'pick' }, box,
        h('div', {},
          h('div', { class: 'top' }, h('span', {}, o.id, h('span', { class: 'badge b-' + o.state }, LABEL[o.state] || o.state.toUpperCase()), o.gift_note ? ' 🎁' : ''), h('span', {}, inr(o.total))),
          h('div', { class: 'meta' }, o.name + ' · ' + o.boxes + ' box' + (o.boxes === 1 ? '' : 'es') + ' · ' + when(o.paid_at || o.created_at) + (o.coupon ? ' · ' + o.coupon : '')),
          ['topack', 'packed', 'shipped'].indexOf(o.state) >= 0 ? h('div', { class: 'meta' }, o.items.map(function (i) { return i.name + ' ×' + i.qty + (i.contents ? ' (' + i.contents + ')' : ''); }).join(', ')) : null))));
    });
    bulkBar();
  }

  // ── bulk actions: pick list, packing slips, mark packed ──
  function selectedIds() { return Object.keys(state.sel).filter(function (id) { return state.orders.some(function (o) { return o.id === id; }); }); }
  function printableIds() { var s = selectedIds(); return s.length ? s : visible().filter(function (o) { return o.state === 'topack' || o.state === 'packed'; }).map(function (o) { return o.id; }); }
  function bulkBar() {
    var b = $('bulk'); b.textContent = '';
    var vis = visible().filter(function (o) { return o.state === 'topack' || o.state === 'packed'; });
    if (!vis.length) { b.hidden = true; return; }
    b.hidden = false;
    var sel = selectedIds(), n = sel.length;
    b.appendChild(h('button', { class: 'chip', onclick: function () { vis.forEach(function (o) { state.sel[o.id] = 1; }); render(); } }, 'Select all ' + vis.length));
    if (n) b.appendChild(h('button', { class: 'chip', onclick: function () { state.sel = {}; render(); } }, 'Clear (' + n + ')'));
    b.appendChild(h('button', { class: 'btn ghost small', onclick: function () { printSheets('pick'); } }, 'Print pick list' + (n ? ' (' + n + ')' : '')));
    b.appendChild(h('button', { class: 'btn ghost small', onclick: function () { printSheets('slips'); } }, 'Print slips' + (n ? ' (' + n + ')' : '')));
    var toPack = sel.filter(function (id) { return state.orders.some(function (o) { return o.id === id && o.state === 'topack'; }); });
    if (toPack.length) b.appendChild(h('button', { class: 'btn small', onclick: function (e) {
      if (!confirm('Mark ' + toPack.length + ' order' + (toPack.length === 1 ? '' : 's') + ' as packed?')) return;
      e.target.disabled = true;
      api('/admin/api/orders/bulk-pack', { method: 'POST', body: { ids: toPack } }).then(function (j) {
        if (!j.ok) { e.target.disabled = false; return toast(j.error || 'Failed', 6000); }
        var bad = j.results.filter(function (r) { return !r.ok; });
        toast(j.packed + ' packed' + (bad.length ? ' · ' + bad.length + ' skipped: ' + bad[0].id + ' ' + bad[0].error : ''), 6000);
        state.sel = {}; load();
      });
    } }, 'Mark ' + toPack.length + ' packed'));
  }
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function printOne(id, kind) { printSheets(kind, [id]); }
  function printSheets(kind, only) {
    var ids = only || printableIds(); if (!ids.length) return toast('Nothing to print');
    var w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print');
    api('/admin/api/picklist', { method: 'POST', body: { ids: ids } }).then(function (j) {
      if (!j.ok) { w.close(); return toast(j.error || 'Could not build the sheet'); }

  // ── order sheet ──
  function openOrder(id) { api('/admin/api/orders/' + encodeURIComponent(id)).then(function (j) { if (!j.ok) return toast(j.error); state.open = j.order; draw(j.order); $('sheet').classList.add('on'); }); }

    p.appendChild(section('Ship to', kv([['Name', o.name], ['Phone', '+' + o.phone]]), addr,
      h('div', { class: 'acts' }, h('a', { class: 'btn small', href: 'https://wa.me/' + encodeURIComponent(o.phone), target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, 'WhatsApp'), h('a', { class: 'btn ghost small', href: 'tel:+' + o.phone, style: 'text-decoration:none' }, 'Call'))));

    p.appendChild(section('Payment & invoice', kv([['Payment', o.payment_id || 'not paid'], ['Invoice', o.invoice_no ? o.invoice_no + ' (' + (o.supply === 'intra' ? 'CGST+SGST' : 'IGST') + ')' : ''], ['Email', o.email || 'none given'], ['Refunded', o.refunded ? inr(o.refunded) : '']]),
      o.invoice_no ? h('div', { class: 'acts' },
        h('button', { class: 'btn ghost small', onclick: function () { fetch('/admin/api/orders/' + encodeURIComponent(o.id) + '/invoice.pdf', { headers: { Authorization: 'Bearer ' + token } }).then(function (r) { return r.ok ? r.blob() : Promise.reject(); }).then(function (b) { window.open(URL.createObjectURL(b), '_blank'); }).catch(function () { toast('Could not open the invoice'); }); } }, 'View invoice PDF'),
        state.role !== 'owner' ? null : h('button', { class: 'btn ghost small', onclick: function (e) { if (confirm('Send the invoice again to the customer?')) act('/admin/api/orders/' + encodeURIComponent(o.id) + '/resend-invoice', {}, function (j) { return 'Invoice sent by ' + j.sent.join(' and '); }, e.target); } }, 'Resend invoice')) : null));

    if (o.credit_notes.length) p.appendChild(section('Refunds & credit notes', o.credit_notes.map(function (c) { return h('div', { class: 'line' }, h('div', {}, c.no, h('small', {}, c.reason + (c.full ? ' · order closed' : '') + ' · ' + when(c.at))), h('div', {}, inr(c.amount))); })));

        h('button', { class: 'btn ghost small', onclick: function () { printOne(o.id, 'slips'); } }, 'Print slip'))));

      o.state === 'shipped' ? h('div', { class: 'acts' }, h('button', { class: 'btn small', onclick: function (e) { if (confirm('Mark this order as delivered?')) act(adv, { to: 'delivered' }, 'Marked delivered', e.target); } }, 'Mark delivered')) : null));
