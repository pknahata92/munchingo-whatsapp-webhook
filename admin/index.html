<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Munchingo Admin</title>
<style>
:root{--navy:#0B2D50;--gold:#CEAD5E;--terra:#A35A34;--terra-d:#86482A;--cream:#FAF6EB;--paper:#FFFDF8;--ink:#2A1A12;--ink2:#5B4537;--line:#E4D6BE;--band:#F3E6CC;--green:#2A6F44;--red:#A63B38;--amber:#8A5A0F;--tx-terra:#A35A34;--tx-red:#A63B38;--tx-green:#2A6F44;--tx-amber:#8A5A0F}
@media (prefers-color-scheme:dark){:root{--cream:#1B1612;--paper:#241D18;--ink:#F3EADB;--ink2:#C9B9A4;--line:#3A2F27;--band:#2B231C;--tx-terra:#E39A72;--tx-red:#F08A83;--tx-green:#6FCB94;--tx-amber:#E6B450}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:20}
header img{height:38px;width:auto}header .sp{flex:1}header small{opacity:.8;font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--terra);color:#fff;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--terra-d)}.btn.ghost{background:transparent;color:var(--tx-terra);border:1.5px solid var(--terra)}
.btn.red{background:var(--red)}.btn.small{padding:7px 14px;min-height:36px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase}
main{max-width:980px;margin:0 auto;padding:16px}
.login{max-width:380px;margin:12vh auto;padding:0 16px;text-align:center}
.login h1{font-size:22px;margin:10px 0 4px}.login p{color:var(--ink2);margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(8,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:20px}.tile span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;min-height:38px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card:hover{border-color:var(--terra)}.card .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.card .meta{color:var(--ink2);font-size:13px;margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px;letter-spacing:.04em}
.b-test{background:#E8E1F4;color:#5A3E99}.b-topack{background:#FDF0D5;color:var(--amber)}.b-packed{background:#E3ECF6;color:var(--navy)}.b-shipped{background:#DDEFE3;color:var(--green)}.b-delivered{background:var(--green);color:#fff}.b-refunded,.b-cancelled{background:#F6DAD8;color:var(--red)}.b-unpaid{background:var(--band);color:var(--ink2)}
.unpaidbar{background:#3A2B12;border:1px solid #8F6B25;color:#FBEFD5;border-radius:12px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.unpaidbar[hidden]{display:none}.unpaidbar b{color:#F5C970}.unpaidbar.hot{background:#4A211C;border-color:#B5584B}.unpaidbar.hot b{color:#FFB4A8}.badge.b-stale{background:#FBE4E0;color:var(--tx-red)}.paybox{background:#2B2118;border:1px solid #5A4630;border-radius:12px;padding:12px 14px;margin:6px 0}.paybox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;overflow:auto}
.sheet.on{display:block}.panel{background:var(--cream);max-width:640px;margin:0 auto;min-height:100%;padding:16px 16px 40px}
@media(min-width:700px){.panel{margin:24px auto;min-height:0;border-radius:18px}}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.sec h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-terra)}
.gift{background:#FBEFE8;color:#2A1A12;border:1px dashed var(--terra);border-radius:12px;padding:12px 14px;margin:10px 0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:14px}.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-word}
.line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.line small{display:block;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:50;max-width:92vw;text-align:center}
.err{color:var(--tx-red);font-size:13px;margin-top:8px;min-height:18px}.muted{color:var(--ink2);font-size:13px}
a{color:var(--tx-terra)}
.money[hidden]{display:none}
.hdrbtn{padding:6px 12px;min-height:34px;font-size:13px}
@media(max-width:520px){header{gap:8px;padding:8px 10px}header img{height:30px}header small{display:none}}
.money{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:var(--ink2)}.money b{color:var(--ink);font-size:15px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.step{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer;min-height:76px}
.step b{display:block;font-size:26px;line-height:1.1}.step span{font-size:12px;font-weight:700;letter-spacing:.03em}.step small{display:block;font-size:10px;color:var(--ink2);margin-bottom:2px}
.step.on{background:var(--navy);border-color:var(--navy);color:#fff}.step.on small{color:#ffffffbb}
.hint{background:var(--band);border-radius:12px;padding:9px 12px;font-size:13px;margin:0 0 10px}
.qa{margin-top:8px}.qa .btn{width:100%}
.more{margin:0 0 8px}.more summary{cursor:pointer;color:var(--tx-terra);font-weight:600;font-size:13px;padding:6px 0}
.note{font-size:12px;color:var(--tx-amber);margin:-6px 0 10px}
.pick{display:flex;gap:10px;align-items:flex-start}.pick input{width:22px;min-height:22px;margin-top:3px;flex:none}.pick>div{flex:1;min-width:0}
.tl{font-size:13px;color:var(--ink2)}.tl div{padding:4px 0;border-bottom:1px solid var(--line)}.tl div:last-child{border:0}.tl b{color:var(--ink)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.sw:last-child{border:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}.ctl select{width:auto;min-width:140px;flex:1 1 150px}
.inl{display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:13px}.inl input{width:auto;min-height:38px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0 10px;font-size:13px;color:var(--ink2)}.bar .sp{flex:1}.bar b{color:var(--ink)}
.ctl[hidden]{display:none}
.bar .btn{white-space:nowrap}.bar span:first-child{line-height:1.3}
.chip.tog.on,.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ── Shell: light header, tabs ── */
header{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}
header .logo{display:inline-flex;background:var(--navy);border-radius:12px;padding:5px 12px}header .logo img{height:30px}
header small{color:var(--ink2);opacity:1}
.hdrbtn.plain{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;cursor:pointer;font-weight:600}
.hdrbtn.plain:hover{border-color:var(--terra);color:var(--tx-terra)}
#helpBtn{width:34px;padding:0}
.tabs{display:flex;background:var(--paper);border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.tabs[hidden]{display:none}
.tab{flex:1;border:0;border-top:3px solid transparent;background:transparent;padding:12px 8px;min-height:54px;font-weight:700;font-size:15px;color:var(--ink2);cursor:pointer}
.tab.on{color:var(--tx-terra);border-top-color:var(--terra)}
#app{padding-bottom:70px}
@media(min-width:700px){
  .tabs{position:sticky;top:55px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0 16px;gap:4px;justify-content:center}
  .tab{flex:0 0 auto;min-width:130px;border-top:0;border-bottom:3px solid transparent}.tab.on{border-bottom-color:var(--terra)}
  #app{padding-bottom:0}
}
.moregrid{display:grid;gap:10px;margin-top:6px}
.morebtn{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:64px}
.morebtn:hover{border-color:var(--terra)}.morebtn b{display:block;font-size:16px}.morebtn span{color:var(--ink2);font-size:13px}
.pagehead{font-size:20px;font-weight:700;margin:4px 0 6px}

/* ── Needs you now ── */
.needs{display:grid;gap:8px;margin:2px 0 10px}
@media(min-width:700px){.needs{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}}
.need{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--terra);border-radius:14px;padding:11px 14px;cursor:pointer;min-height:56px}
.need:hover{border-color:var(--terra)}.need b{font-size:26px;line-height:1;min-width:32px;text-align:center}.need span{font-size:14px;color:var(--ink)}
.need.hot{border-left-color:var(--red)}.need.calm{border-left-color:var(--green);cursor:default}
.today{margin:0 0 10px}.today b{color:var(--ink)}

/* ── First-time guide ── */
.guide{background:var(--band);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:2px 0 12px}
.guide b{display:block;font-size:16px;margin-bottom:6px}.guide ol{margin:0 0 10px;padding-left:20px;line-height:1.6;font-size:14px}.guide li b{display:inline;font-size:14px;margin:0}
.b-gift{background:#FBE3D6;color:#7A3512}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <img src="/admin/logo.png" alt="Munchingo" style="height:84px;background:var(--navy);padding:10px 18px;border-radius:16px">
  <h1>Munchingo admin</h1>
  <p>We will email a 6-digit code to your business inbox.</p>
  <div id="stepEmail">
    <input id="email" type="email" placeholder="Your email" autocomplete="email" inputmode="email">
    <div style="height:10px"></div><button class="btn" style="width:100%" id="sendCode">Email me a code</button>
  </div>
  <div id="stepCode" hidden>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" style="text-align:center;font-size:22px;letter-spacing:.3em">
    <div style="height:10px"></div><button class="btn" style="width:100%" id="verify">Sign in</button>
    <p class="muted" style="margin-top:12px"><a href="#" id="again">Use a different email or get a new code</a></p>
  </div>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" hidden>
  <header>
    <span class="logo"><img src="/admin/logo.png" alt="Munchingo"></span><span class="sp"></span><small id="who"></small>
    <button class="hdrbtn plain" id="helpBtn" aria-label="Help" type="button">?</button><button class="hdrbtn plain" id="out" type="button">Sign out</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
    <button class="tab on" data-tab="orders" role="tab" aria-selected="true" type="button">Orders</button>
    <button class="tab" data-tab="stock" role="tab" aria-selected="false" type="button">Stock</button>
    <button class="tab" data-tab="more" id="moreTab" role="tab" aria-selected="false" type="button" hidden>More</button>
  </nav>
  <main id="viewOrders">
    <div class="guide" id="guide" hidden></div>
    <div class="needs" id="needs"></div>
    <p class="muted today" id="todayLine" hidden></p>
    <p class="note" id="moneyNote" hidden></p>
    <div class="flow" id="flow"></div>
    <div class="hint" id="hint"></div>
    <div class="chips" id="chips"></div>
    <div class="row"><input id="q" aria-label="Search orders" placeholder="Search name, phone, address, pincode, order or invoice no."><button class="btn ghost small" id="filterBtn" type="button">Filter</button><button class="btn ghost small" id="reload">Refresh</button></div>
    <div class="bar"><span id="count"></span><span class="sp"></span><button class="chip" id="sortFlip" type="button" aria-label="Reverse the order of the list"></button></div>
    <div class="bar" id="bulk" hidden style="flex-wrap:wrap"></div>
    <div id="list"></div>
  </main>
  <main id="viewStock" hidden></main>
  <main id="viewMore" hidden></main>
  <div id="filterTpl" hidden><div id="filterBox">
    <div class="ctl">
      <select id="sort" aria-label="Sort by">
        <option value="new">Newest first</option><option value="old">Oldest first</option>
        <option value="valueDesc">Highest value</option><option value="valueAsc">Lowest value</option>
        <option value="boxesDesc">Most boxes</option><option value="boxesAsc">Fewest boxes</option><option value="nameAZ">Name A to Z</option><option value="nameZA">Name Z to A</option>
      </select>
      <select id="range" aria-label="Date">
        <option value="all">Any date</option><option value="today">Today</option><option value="yesterday">Yesterday</option>
        <option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="month">This month</option><option value="custom">Pick dates…</option>
      </select>
      <button class="chip" id="fGift" type="button">Gift notes</button>
      <button class="chip" id="fCoupon" type="button">Coupon used</button>
      <button class="chip" id="fSet" type="button">Gift sets</button>
    </div>
    <div class="ctl"><button class="btn ghost small" id="csv" type="button">Download CSV</button><button class="btn ghost small" id="reset" type="button">Clear filters</button></div>
    <div class="ctl" id="customDates" hidden><label class="inl">From <input type="date" id="dFrom"></label><label class="inl">To <input type="date" id="dTo"></label></div>
    </div></div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div id="toast"></div>

<script src="/admin/pdf-lib.min.js" defer></script>
<script src="/admin/labelsheet.js" defer></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var token = ''; try { token = localStorage.getItem('mngAdminToken') || ''; } catch (e) {}
  var state = { role: 'staff', sel: {}, orders: [], filter: 'topack', reasons: {}, open: null, sort: 'new', range: 'all', from: '', to: '', gift: false, coupon: false, set: false };
  try { var saved = JSON.parse(localStorage.getItem('mngAdminView') || '{}'); ['filter', 'sort', 'range', 'from', 'to', 'gift', 'coupon', 'set'].forEach(function (k) { if (saved[k] != null) state[k] = saved[k]; }); } catch (e) {}
  function saveView() { try { localStorage.setItem('mngAdminView', JSON.stringify({ filter: state.filter, sort: state.sort, range: state.range, from: state.from, to: state.to, gift: state.gift, coupon: state.coupon, set: state.set })); } catch (e) {} }
  var IST = 5.5 * 3600 * 1000;
  var istDay = function (iso) { return new Date(Date.parse(iso) + IST).toISOString().slice(0, 10); };
  var dayShift = function (n) { return new Date(Date.now() + IST - n * 86400000).toISOString().slice(0, 10); };

  // Safe DOM builder: text is always set as text, never as HTML.
  function h(tag, attrs) {
    var el = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'class') el.className = attrs[k]; else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    });
    kids.flat().forEach(function (c) { if (c == null || c === false) return; el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c); });
    return el;
  }
  var inr = function (n) { return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
  var when = function (iso) { return iso ? new Date(iso).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''; };
  function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, ms || 3500); }

  function api(path, opts) {
    opts = opts || {};
    return fetch(path, { method: opts.method || 'GET', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Unexpected reply' }; }).then(function (j) { if (r.status === 401 && token) { signOut(true); } return j; }); });
  }

  // ── sign in ──
  function showLogin() { $('app').hidden = true; $('login').hidden = false; try { $('email').value = localStorage.getItem('mngAdminEmail') || ''; } catch (e) {} }
  function signOut(expired) { token = ''; try { localStorage.removeItem('mngAdminToken'); } catch (e) {} showLogin(); if (expired) $('loginErr').textContent = 'Please sign in again.'; }
  $('sendCode').onclick = function () {
    var email = $('email').value.trim(); if (!email) return;
    $('sendCode').disabled = true; $('loginErr').textContent = '';
    api('/admin/api/login', { method: 'POST', body: { email: email } }).then(function (j) {
      $('sendCode').disabled = false;
      if (j.ok) { try { localStorage.setItem('mngAdminEmail', email); } catch (e) {} $('stepEmail').hidden = true; $('stepCode').hidden = false; $('code').focus(); toast('If that address is allowed, a code is on its way.'); }
      else $('loginErr').textContent = j.error || 'Could not send the code.';
    });
  };
  $('verify').onclick = function () {
    $('loginErr').textContent = '';
    api('/admin/api/verify', { method: 'POST', body: { email: $('email').value.trim(), code: $('code').value.trim() } }).then(function (j) {
      if (j.ok) { token = j.token; try { localStorage.setItem('mngAdminToken', token); } catch (e) {} $('code').value = ''; start(); }
      else $('loginErr').textContent = j.error || 'That code did not work.';
    });
  };
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('verify').click(); });
  $('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('sendCode').click(); });
  $('again').onclick = function (e) { e.preventDefault(); $('stepCode').hidden = true; $('stepEmail').hidden = false; $('loginErr').textContent = ''; };
  $('out').onclick = function () { signOut(false); };

  // ── main list ──
  var STEPS = [['topack', '1', 'To pack', 'Tick the orders, print the pick list and slips, pack them, then tap Mark packed.'], ['packed', '2', 'Packed', 'Tap Create shipment on each order. You get a tracking number and the customer is emailed. For Porter or hand delivery, open the order.'], ['shipped', '3', 'Shipped', 'On the way. Tick orders and tap Shipping labels to print the courier labels together. When it reaches the customer, tap Mark delivered.'], ['delivered', '4', 'Delivered', 'Finished orders. Nothing to do here.']];
  var FILTERS = [['attention', 'Needs attention'], ['refunded', 'Cancelled'], ['unpaid', 'Unpaid'], ['test', 'Test'], ['all', 'All']];
  var LABEL = { topack: 'TO PACK', packed: 'PACKED', shipped: 'SHIPPED', delivered: 'DELIVERED', test: 'TEST', refunded: 'CANCELLED', cancelled: 'CANCELLED' };
  function start() {
    $('login').hidden = true; $('app').hidden = false;
    api('/admin/api/me').then(function (j) { if (j.ok) { state.role = j.role; $('who').textContent = (j.name || j.email) + ' · ' + j.role; $('who').title = j.email; state.reasons = j.reasons; state.dispatchFrom = j.dispatchFrom ? Date.parse(j.dispatchFrom) : 0; $('moreTab').hidden = j.role !== 'owner'; var t0 = ''; try { t0 = localStorage.getItem('mngAdminTab') || ''; } catch (e) {} render(); renderGuide(); showTab(t0); } });
    load();
  }
  // ── tabs: Orders, Stock, More (owner) ──
  var TABS = ['orders', 'stock', 'more'];
  function showTab(n) {
    if (TABS.indexOf(n) < 0 || (n === 'more' && state.role !== 'owner')) n = 'orders';
    state.tab = n;
    TABS.forEach(function (t) { $('view' + t.charAt(0).toUpperCase() + t.slice(1)).hidden = t !== n; });
    [].forEach.call(document.querySelectorAll('#tabs .tab'), function (b) { var on = b.getAttribute('data-tab') === n; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
    try { localStorage.setItem('mngAdminTab', n); } catch (e) {}
    closeSheet();

        h('div', { class: 'acts' }, h('button', { class: 'btn small', onclick: function (e) { save({ active: true }, { email: email.value, name: name.value, role: role.value, active: true }, e.target); } }, 'Add')))]);
    });
  }
  [].forEach.call(document.querySelectorAll('#tabs .tab'), function (b) { b.onclick = function () { showTab(b.getAttribute('data-tab')); }; });
  $('helpBtn').onclick = openHelp; $('filterBtn').onclick = openFilter;
  var FLIP = { 'new': 'old', old: 'new', valueDesc: 'valueAsc', valueAsc: 'valueDesc', boxesDesc: 'boxesAsc', boxesAsc: 'boxesDesc', nameAZ: 'nameZA', nameZA: 'nameAZ' };
  $('sortFlip').onclick = function () { state.sort = FLIP[state.sort] || 'new'; saveView(); render(); };

  if (token) start(); else showLogin();
})();
</script>
</body>
