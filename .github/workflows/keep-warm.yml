name: Keep Render instance warm

# Render's free tier spins the service down after ~15 min of inactivity,
# and the next request pays a cold-start penalty of 50+ seconds (per
# Render's own dashboard warning). That's not just a slow discount check —
# it hits checkout submission and every WhatsApp bot reply too. This pings
# the public health-check endpoint often enough that the instance never
# goes idle long enough to spin down.
#
# This is a workaround, not a real fix — a deploy still causes one cold
# restart, and the free tier's other limits (monthly hour cap, low
# CPU/RAM) still apply. See the checkout UX audit for the real fix
# (upgrading off the free tier).

on:
  schedule:
    # Every 10 minutes — comfortably under Render's ~15 min spin-down window.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          curl -sS -f "https://munchingo-whatsapp-webhook.onrender.com/"
