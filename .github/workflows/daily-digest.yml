name: Daily packing-list digest

on:
  schedule:
    # 08:00 IST = 02:30 UTC, every day.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Call daily digest endpoint
        run: |
          curl -sS -f "https://munchingo-whatsapp-webhook.onrender.com/internal/daily-digest?secret=${{ secrets.DIGEST_SECRET }}"
