name: Broadcast (WhatsApp, by hand only)

# One approved marketing template to everyone who said yes to WhatsApp updates (utils/broadcast.js), one segment only (spec 6.4):
# all consented Delhi NCR contacts. Left out: a newest paid order outside the area, or a complaint in the last 30 days.
# Order: mode=dry (counts only) -> mode=test (OWNER_PHONE only) -> mode=send with expect = the dry-run "to_send".
# Fresh-batch alert (J7): template=munchingo_fresh_batch, lots=<the new lot codes>, image=<the batch ticket picture>. It is refused
# until each lot is the one packing takes for its Flavor; campaign defaults to batch_<YYMMDD of the bake date>.
on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Approved template name (e.g. munchingo_diwali_2026)'
        required: true
      mode:
        description: 'dry = count only, test = owner only, send = everyone'
        required: true
        default: 'dry'
        type: choice
        options: [dry, test, send]
      video:
        description: 'https link to the header .mp4 (blank if the template has no video)'
        required: false
        default: ''
      image:
        description: 'https link to the header picture (blank if the template has no picture)'
        required: false
        default: ''
      sources:
        description: 'Only these sign-up places, e.g. stall,fair (blank = every consented NCR contact)'
        required: false
        default: ''
      exclude:
        description: 'Skip people from these sign-up places, e.g. stall,fair'
        required: false
        default: ''
      expect:
        description: 'For send: the to_send number from the dry run'
        required: false
        default: ''
      lang:
        description: 'Template language code'
        required: false
        default: 'en'
      lots:
        description: 'Fresh-batch alert only: the new lot codes, e.g. MNGO-261120-01,MNGA-261120-01'
        required: false
        default: ''
      campaign:
        description: 'Campaign tag (blank = none; a fresh-batch alert uses batch_<YYMMDD of the bake date>)'
        required: false
        default: ''

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Call the broadcast endpoint
        env:
          SECRET: ${{ secrets.DIGEST_SECRET }}
          TEMPLATE: ${{ inputs.template }}
          MODE: ${{ inputs.mode }}
          VIDEO: ${{ inputs.video }}
          IMAGE: ${{ inputs.image }}
          SOURCES: ${{ inputs.sources }}
          EXPECT: ${{ inputs.expect }}
          EXCLUDE: ${{ inputs.exclude }}
          LANG_CODE: ${{ inputs.lang }}
          LOTS: ${{ inputs.lots }}
          CAMPAIGN: ${{ inputs.campaign }}
        run: |
          curl -sS -m 900 -G "https://munchingo-whatsapp-webhook.onrender.com/internal/broadcast" \
            --data-urlencode "secret=$SECRET" --data-urlencode "template=$TEMPLATE" --data-urlencode "mode=$MODE" \
            --data-urlencode "video=$VIDEO" --data-urlencode "image=$IMAGE" --data-urlencode "sources=$SOURCES" --data-urlencode "expect=$EXPECT" --data-urlencode "exclude=$EXCLUDE" \
            --data-urlencode "lang=$LANG_CODE" --data-urlencode "lots=$LOTS" --data-urlencode "campaign=$CAMPAIGN" -w '\nHTTP %{http_code}\n' | tee out.txt
          grep -q '"ok":true' out.txt
