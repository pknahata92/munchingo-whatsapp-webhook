name: Review requests — daily

on:
  schedule:
    # 11:00 IST = 05:30 UTC, every day. Sends nothing unless REVIEW_REQUESTS_ENABLED=1 on Render.
    - cron: '30 5 * * *'
  workflow_dispatch: {}

jobs:
  trigger-review-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Call review request endpoint
        run: |
          curl -sS -f "https://munchingo-whatsapp-webhook.onrender.com/internal/review-requests?secret=${{ secrets.DIGEST_SECRET }}"
